[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-image-steganography"
version = "2.1.0"
description = "Password-protected AES-GCM message hiding in PNG images using LSB steganography"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Lavkush Prasad"}]
dependencies = ["Pillow>=10.0", "cryptography>=42.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.11"]

[project.scripts]
secure-steganography = "secure_steganography.interface.cli:main"
stegano = "secure_steganography.interface.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
